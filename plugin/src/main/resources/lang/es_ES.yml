config-version: 1

prefix: '<white>[</white><gradient:#F7B733:#FC4A1A>FrameSort</gradient><white>]</white> '

command:
  help:
    layout:
      - ''
      - '<gradient:#F7B733:#FC4A1A>◤<st>                          </st></gradient> <prefix><gradient:#FC4A1A:#F7B733><st>                          </st>◥</gradient>'
      - ''
      - '  <hover:show_text:"<gray>Con la mano vacía: sus destinos brillan<newline>y se listan. Con un item en la otra mano,<newline>solo adónde va ese item.</gray>"><white>Shift + clic derecho</white> <gray>a un sorter o pad</gray></hover>'
      - '  <hover:show_text:"<gray>Con la mano vacía: lo marca o<newline>desmarca como destino.</gray>"><white>Shift + clic derecho</white> <gray>a un marco</gray></hover>'
      - '  <hover:show_text:"<gray>Muestra qué acepta un marco,<newline>de quién es y adónde van los items.</gray>"><white>Shift + clic izquierdo</white> <gray>a un marco</gray></hover>'
      - ''
      - '<entries>'
      - ''
      - '<gradient:#F7B733:#FC4A1A>◣<st>                                   </st></gradient><gradient:#FC4A1A:#F7B733><st>                                   </st>◢</gradient>'
      - ''
    automark: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Si un item que metes en un marco<newline>sobre un contenedor lo marca.</gray>"><white><usage></white> <dark_gray>automarcado sí/no</dark_gray></hover>'
    tag-list: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Todos los tags de items y bloques,<newline>y los de tags.yml.</gray>"><white><usage> [página]</white> <dark_gray>todos</dark_gray></hover>'
    tag-search: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Tags cuyo nombre contiene un texto.</gray>"><white><usage> \<texto> [página]</white> <dark_gray>buscar</dark_gray></hover>'
    tag-show: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Los items o bloques de un tag.</gray>"><white><usage> \<tag> [página]</white> <dark_gray>contenido</dark_gray></hover>'
    tag-apply: '  <color:#F7B733>•</color> <hover:show_text:"<gray>El item de tu mano representa el tag<newline>cuando lo pones en un marco.</gray>"><white><usage> \<tag></white> <dark_gray>etiquetar</dark_gray></hover>'
    tag-remove: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Quita el tag del item de tu mano.</gray>"><white><usage></white> <dark_gray>quitar tag</dark_gray></hover>'
    where: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Adónde iría el item de tu mano<newline>desde el sorter o pad más cercano.</gray>"><white><usage></white> <dark_gray>adónde va</dark_gray></hover>'
    trace: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Muestra las entregas a tu alrededor<newline>un rato, o deja de mostrarlas.</gray>"><white><usage> [segundos|stop]</white> <dark_gray>ver</dark_gray></hover>'
    trust: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Tus sorters y pads también envían<newline>a los marcos de ese jugador.</gray>"><white><usage> \<jugador></white> <dark_gray>compartir</dark_gray></hover>'
    untrust: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Deja de confiar en un jugador.</gray>"><white><usage> \<jugador></white> <dark_gray>dejar de compartir</dark_gray></hover>'
    trusted: '  <color:#F7B733>•</color> <hover:show_text:"<gray>En quién confías y quién confía en ti.</gray>"><white><usage> [página]</white> <dark_gray>tu confianza</dark_gray></hover>'
    give: '  <color:#F7B733>•</color> <hover:show_text:"<white><usage> sorter [jugador] [cantidad]</white><newline><white><usage> pad \<tipo> [jugador] [cantidad]</white><newline><gray>Da activadores de sorter y bloques de pad.</gray>"><white><usage> sorter|pad …</white> <dark_gray>dar items</dark_gray></hover>'
    reload: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Recarga la configuración.</gray>"><white><usage></white> <dark_gray>recargar</dark_gray></hover>'
  reloaded: '<prefix><green>Configuración recargada.</green>'
  reloaded-with-warnings: '<prefix><yellow><hover:show_text:"<gray>Esos ajustes usan su valor por defecto.<newline>Mira la consola.</gray>">Recargada con <count> aviso(s)</hover></yellow>'
  reload-failed: '<prefix><red><hover:show_text:"<gray><error><newline>Sigue activa la configuración anterior.</gray>">La recarga falló: mira la consola</hover></red>'
  reload-running: '<prefix><yellow><hover:show_text:"<gray>Vuelve a intentarlo cuando termine.</gray>">Ya hay una recarga en curso</hover></yellow>'
  players-only: '<prefix><red>Solo los jugadores pueden usar este comando.</red>'

pager:
  layout:
    - ''
    - '<gradient:#F7B733:#FC4A1A>◤<st>                          </st></gradient> <prefix><gradient:#FC4A1A:#F7B733><st>                          </st>◥</gradient>'
    - ''
    - '  <white><title></white> <dark_gray>·</dark_gray> <gray><total></gray>'
    - ''
    - '<entries>'
    - ''
    - '<gradient:#F7B733:#FC4A1A>◣<st>                         </st></gradient> <previous> <white>| <page>—<pages> |</white> <next> <gradient:#FC4A1A:#F7B733><st>                         </st>◢</gradient>'
    - ''
  empty: '<gray>  No hay nada que mostrar.</gray>'
  previous:
    enabled: '<hover:show_text:"<gray>Clic para ir a la página <page></gray>"><gradient:#F7B733:#FC4A1A>«</gradient></hover>'
    disabled: '<dark_gray>«</dark_gray>'
  next:
    enabled: '<hover:show_text:"<gray>Clic para ir a la página <page></gray>"><gradient:#FC4A1A:#F7B733>»</gradient></hover>'
    disabled: '<dark_gray>»</dark_gray>'

inspect:
