    sorter: 'sorter'
    pad: 'pad clasificador'
  title: '<hover:show_text:"<details>">Destinos de este <source></hover>'
  title-item: '<hover:show_text:"<details>">Adónde va <item></hover>'
  details:
    place: '<gray>En <white><x>, <y>, <z></white></gray>'
    owner: '<gray>Dueño: <white><player></white></gray>'
    no-owner: '<gray>Sin dueño</gray>'
    sorted: '<gray>Enviados: <white><count></white> items</gray>'
  level:
    first: '  <color:#F7B733><number>.</color> <white>Primera opción</white>'
    next: '  <color:#F7B733><number>.</color> <white>Cuando se llenen</white>'
  branch:
    middle: '     <dark_gray>├</dark_gray> <entry>'
    last: '     <dark_gray>└</dark_gray> <entry>'
  excess:
    lava: '  <red>Lo que sobre va a la lava</red>'
    stay: '  <gray>Lo que sobre espera sitio</gray>'
  target:
    dropped: '<yellow>se suelta aquí</yellow>'
    lava: '<red>lava</red>'
  line: '  <color:#F7B733>•</color> <entry>'
  entry: '<white><item></white> <dark_gray>→</dark_gray> <hover:show_text:"<gray><x>, <y>, <z></gray>"><target></hover> <dark_gray><distance> m</dark_gray>'
  gone: '<prefix><gray><hover:show_text:"<gray>Se quitó, su chunk no está cargado<newline>o ya no puedes verlo.</gray>">Ya no está al día: vuelve a inspeccionar</hover></gray>'
  not-trusted: '<prefix><red><hover:show_text:"<gray>Solo su dueño y los jugadores en<newline>quienes confía pueden inspeccionarlo.</gray>">Este <source> es de <white><player></white></hover></red>'
  no-owner: '<prefix><red><hover:show_text:"<gray>Se construyó antes de que hubiera dueños.<newline>Rehazlo para que sea tuyo.</gray>">Este <source> no tiene dueño</hover></red>'
  opens: '<prefix><gray><hover:show_text:"<gray>El sorter envía primero lo de dentro;<newline>cuando nada de dentro puede ir a ningún<newline>sitio, lo envía entero, como se lista.</gray>">Abre <white><item></white> primero</hover></gray>'

frame:
  layout:
    - ''
    - '<gradient:#F7B733:#FC4A1A>◤<st>                          </st></gradient> <prefix><gradient:#FC4A1A:#F7B733><st>                          </st>◥</gradient>'
