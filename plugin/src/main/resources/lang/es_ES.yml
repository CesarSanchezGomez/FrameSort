    wrong-type: '  <red>✘</red> <hover:show_text:"<gray>Este tipo de marco no está en<newline>targets.frame-types.</gray>"><gray>No puede ser destino</gray></hover>'
  owner: '  <color:#F7B733>•</color> <gray>Dueño:</gray> <white><player></white>'
  no-owner: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Desmárcalo y vuelve a marcarlo<newline>para que sea tuyo.</gray>"><gray>Sin dueño</gray></hover>'
  into:
    container: '  <color:#F7B733>•</color> <gray>Van a</gray> <white><block></white>'
    dropped: '  <color:#F7B733>•</color> <yellow>Se sueltan</yellow> <gray>delante</gray>'
    lava: '  <color:#F7B733>•</color> <red>Se destruyen</red> <gray>en la lava</gray>'
  accepts:
    exact: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Primero el item exacto: mismo nombre,<newline>encantamientos y contenido.</gray>"><gray>Acepta</gray> <white><item></white></hover>'
    tag: '  <color:#F7B733>•</color> <hover:show_text:"<gray><count> items.</gray>"><gray>Acepta</gray> <white>#<tag></white> <dark_gray>[<count>]</dark_gray></hover>'
    tag-link: '  <color:#F7B733>•</color> <hover:show_text:"<gray><count> items. Clic para verlos.</gray>"><gray>Acepta</gray> <white>#<tag></white> <dark_gray>[<count>]</dark_gray></hover>'
    contents: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Los <count> stacks que tiene dentro.</gray>"><gray>Acepta lo que contiene</gray></hover>'
    similar: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Cuando nada coincide mejor.</gray>"><gray>Después cualquier</gray> <white><material></white></hover>'
    custom: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Cuando nada coincide mejor.</gray>"><gray>Después cualquier</gray> <white><id></white></hover>'
    default: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Lo que no encaja en ningún otro marco<newline>o ya no cabe en ellos.</gray>"><gray>Destino por defecto</gray></hover>'
  on-sorter: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Un sorter nunca envía a otro sorter.</gray>"><gray>En un sorter: solo pads</gray></hover>'
  sources: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Sorters y pads cuyos items<newline>pueden llegar a este marco.</gray>"><gray>Fuentes al alcance:</gray> <white><count></white></hover>'

