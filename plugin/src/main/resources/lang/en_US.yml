config-version: 1

prefix: '<white>[</white><gradient:#F7B733:#FC4A1A>FrameSort</gradient><white>]</white> '

command:
  help:
    layout:
      - ''
      - '<gradient:#F7B733:#FC4A1A>◤<st>                          </st></gradient> <prefix><gradient:#FC4A1A:#F7B733><st>                          </st>◥</gradient>'
      - ''
      - '  <hover:show_text:"<gray>With an empty hand: its targets glow<newline>and are listed. Hold an item in your<newline>off hand to see only where it goes.</gray>"><white>Sneak + right-click</white> <gray>a sorter or pad</gray></hover>'
      - '  <hover:show_text:"<gray>With an empty hand: marks or<newline>unmarks it as a target.</gray>"><white>Sneak + right-click</white> <gray>a frame</gray></hover>'
      - '  <hover:show_text:"<gray>Shows what a frame accepts,<newline>who owns it and where items go.</gray>"><white>Sneak + left-click</white> <gray>a frame</gray></hover>'
      - ''
      - '<entries>'
      - ''
      - '<gradient:#F7B733:#FC4A1A>◣<st>                                   </st></gradient><gradient:#FC4A1A:#F7B733><st>                                   </st>◢</gradient>'
      - ''
    automark: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Whether an item you put in a frame<newline>on a container marks it.</gray>"><white><usage></white> <dark_gray>automark on/off</dark_gray></hover>'
    tag-list: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Every item and block tag,<newline>and the tags in tags.yml.</gray>"><white><usage> [page]</white> <dark_gray>all tags</dark_gray></hover>'
    tag-search: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Tags whose name contains a text.</gray>"><white><usage> \<text> [page]</white> <dark_gray>find</dark_gray></hover>'
    tag-show: '  <color:#F7B733>•</color> <hover:show_text:"<gray>The items or blocks in a tag.</gray>"><white><usage> \<tag> [page]</white> <dark_gray>contents</dark_gray></hover>'
    tag-apply: '  <color:#F7B733>•</color> <hover:show_text:"<gray>The item in your hand stands for<newline>the tag when you put it in a frame.</gray>"><white><usage> \<tag></white> <dark_gray>tag held item</dark_gray></hover>'
    tag-remove: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Takes the tag off the item in your hand.</gray>"><white><usage></white> <dark_gray>untag held item</dark_gray></hover>'
    where: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Where the item in your hand would go<newline>from the nearest sorter or pad.</gray>"><white><usage></white> <dark_gray>where it goes</dark_gray></hover>'
    trace: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Shows the deliveries around you<newline>for a while, or stops showing them.</gray>"><white><usage> [seconds|stop]</white> <dark_gray>watch</dark_gray></hover>'
    trust: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Your sorters and pads also send<newline>to that player''s frames.</gray>"><white><usage> \<player></white> <dark_gray>share</dark_gray></hover>'
    untrust: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Stops trusting a player.</gray>"><white><usage> \<player></white> <dark_gray>stop sharing</dark_gray></hover>'
    trusted: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Whom you trust and who trusts you.</gray>"><white><usage> [page]</white> <dark_gray>your trust</dark_gray></hover>'
    give: '  <color:#F7B733>•</color> <hover:show_text:"<white><usage> sorter [player] [amount]</white><newline><white><usage> pad \<type> [player] [amount]</white><newline><gray>Gives sorter activators and pad blocks.</gray>"><white><usage> sorter|pad …</white> <dark_gray>give items</dark_gray></hover>'
    reload: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Reloads the configuration.</gray>"><white><usage></white> <dark_gray>reload</dark_gray></hover>'
  reloaded: '<prefix><green>Configuration reloaded.</green>'
  reloaded-with-warnings: '<prefix><yellow><hover:show_text:"<gray>Those settings use their defaults.<newline>See the console.</gray>">Reloaded with <count> warning(s)</hover></yellow>'
  reload-failed: '<prefix><red><hover:show_text:"<gray><error><newline>The previous configuration is still active.</gray>">Reload failed: see the console</hover></red>'
  reload-running: '<prefix><yellow><hover:show_text:"<gray>Try again when it ends.</gray>">A reload is already running</hover></yellow>'
  players-only: '<prefix><red>Only players can use this command.</red>'

pager:
  layout:
    - ''
    - '<gradient:#F7B733:#FC4A1A>◤<st>                          </st></gradient> <prefix><gradient:#FC4A1A:#F7B733><st>                          </st>◥</gradient>'
    - ''
    - '  <white><title></white> <dark_gray>·</dark_gray> <gray><total></gray>'
    - ''
    - '<entries>'
    - ''
    - '<gradient:#F7B733:#FC4A1A>◣<st>                         </st></gradient> <previous> <white>| <page>—<pages> |</white> <next> <gradient:#FC4A1A:#F7B733><st>                         </st>◢</gradient>'
    - ''
  empty: '<gray>  Nothing to show.</gray>'
  previous:
    enabled: '<hover:show_text:"<gray>Click to go to page <page></gray>"><gradient:#F7B733:#FC4A1A>«</gradient></hover>'
    disabled: '<dark_gray>«</dark_gray>'
  next:
    enabled: '<hover:show_text:"<gray>Click to go to page <page></gray>"><gradient:#FC4A1A:#F7B733>»</gradient></hover>'
    disabled: '<dark_gray>»</dark_gray>'

inspect:
  source:
    sorter: 'sorter'
    pad: 'sorting pad'
  title: '<hover:show_text:"<details>">Targets of this <source></hover>'
  title-item: '<hover:show_text:"<details>">Where <item> goes</hover>'
  details:
    place: '<gray>At <white><x>, <y>, <z></white></gray>'
    owner: '<gray>Owner: <white><player></white></gray>'
    no-owner: '<gray>No owner</gray>'
    sorted: '<gray>Sorted: <white><count></white> items</gray>'
  level:
    first: '  <color:#F7B733><number>.</color> <white>First choice</white>'
    next: '  <color:#F7B733><number>.</color> <white>When those are full</white>'
  branch:
    middle: '     <dark_gray>├</dark_gray> <entry>'
    last: '     <dark_gray>└</dark_gray> <entry>'
  excess:
    lava: '  <red>Leftovers go to lava</red>'
    stay: '  <gray>Leftovers wait for room</gray>'
  target:
    dropped: '<yellow>dropped here</yellow>'
    lava: '<red>lava</red>'
  line: '  <color:#F7B733>•</color> <entry>'
  entry: '<white><item></white> <dark_gray>→</dark_gray> <hover:show_text:"<gray><x>, <y>, <z></gray>"><target></hover> <dark_gray><distance> m</dark_gray>'
  gone: '<prefix><gray><hover:show_text:"<gray>It was removed, its chunk isn''t loaded,<newline>or you can''t see it any more.</gray>">Out of date: inspect it again</hover></gray>'
  not-trusted: '<prefix><red><hover:show_text:"<gray>Only its owner and the players<newline>they trust can inspect it.</gray>">This <source> is <white><player></white>''s</hover></red>'
  no-owner: '<prefix><red><hover:show_text:"<gray>Built before owners existed.<newline>Rebuild it to make it yours.</gray>">This <source> has no owner</hover></red>'
  opens: '<prefix><gray><hover:show_text:"<gray>The sorter sends what is inside first;<newline>once nothing inside can go anywhere,<newline>it sends it whole, as listed.</gray>">Opens <white><item></white> first</hover></gray>'

frame:
  layout:
    - ''
    - '<gradient:#F7B733:#FC4A1A>◤<st>                          </st></gradient> <prefix><gradient:#FC4A1A:#F7B733><st>                          </st>◥</gradient>'
    - ''
    - '  <title>'
    - ''
    - '<lines>'
    - ''
    - '<gradient:#F7B733:#FC4A1A>◣<st>                                   </st></gradient><gradient:#FC4A1A:#F7B733><st>                                   </st>◢</gradient>'
    - ''
  title: '<white>Target frame</white> <dark_gray>(<x>, <y>, <z>)</dark_gray>'
  status:
    target: '  <green>✔</green> <gray>A target</gray>'
    unmarked: '  <yellow>✘</yellow> <hover:show_text:"<gray>Sneak + right-click it<newline>with an empty hand.</gray>"><gray>Not a target yet</gray></hover>'
    wrong-type: '  <red>✘</red> <hover:show_text:"<gray>This kind of frame isn''t in<newline>targets.frame-types.</gray>"><gray>Can''t be a target</gray></hover>'
  owner: '  <color:#F7B733>•</color> <gray>Owner:</gray> <white><player></white>'
  no-owner: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Unmark it and mark it again<newline>to make it yours.</gray>"><gray>No owner</gray></hover>'
  into:
    container: '  <color:#F7B733>•</color> <gray>Into</gray> <white><block></white>'
    dropped: '  <color:#F7B733>•</color> <yellow>Dropped</yellow> <gray>in front of it</gray>'
    lava: '  <color:#F7B733>•</color> <red>Destroyed</red> <gray>by lava</gray>'
  accepts:
    exact: '  <color:#F7B733>•</color> <hover:show_text:"<gray>The exact item first: same name,<newline>enchantments and contents.</gray>"><gray>Takes</gray> <white><item></white></hover>'
    tag: '  <color:#F7B733>•</color> <hover:show_text:"<gray><count> items.</gray>"><gray>Takes</gray> <white>#<tag></white> <dark_gray>[<count>]</dark_gray></hover>'
    tag-link: '  <color:#F7B733>•</color> <hover:show_text:"<gray><count> items. Click to list them.</gray>"><gray>Takes</gray> <white>#<tag></white> <dark_gray>[<count>]</dark_gray></hover>'
    contents: '  <color:#F7B733>•</color> <hover:show_text:"<gray>The <count> stacks inside it.</gray>"><gray>Takes what it holds</gray></hover>'
    similar: '  <color:#F7B733>•</color> <hover:show_text:"<gray>When nothing matches better.</gray>"><gray>Then any</gray> <white><material></white></hover>'
    custom: '  <color:#F7B733>•</color> <hover:show_text:"<gray>When nothing matches better.</gray>"><gray>Then any</gray> <white><id></white></hover>'
    default: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Whatever matches no other frame,<newline>or has no room left in one.</gray>"><gray>Default target</gray></hover>'
  on-sorter: '  <color:#F7B733>•</color> <hover:show_text:"<gray>A sorter never sends to another sorter.</gray>"><gray>On a sorter: pads only</gray></hover>'
  sources: '  <color:#F7B733>•</color> <hover:show_text:"<gray>Sorters and pads whose items<newline>can reach this frame.</gray>"><gray>Sources in range:</gray> <white><count></white></hover>'

mark:
  marked: '<prefix><green>Frame marked as a target</green>'
  unmarked: '<prefix><yellow>Frame unmarked</yellow>'
  no-permission: '<prefix><red>You can''t mark targets</red>'
  wrong-type: '<prefix><red>This frame can''t be a target</red>'
  not-yours: '<prefix><red>Only <white><player></white> can unmark this target</red>'

automark:
  enabled: '<prefix><green><hover:show_text:"<gray>An item you put in a frame on a<newline>container or composter marks it.<newline>Other blocks: sneak + right-click.</gray>">Automark on</hover></green>'
  disabled: '<prefix><yellow><hover:show_text:"<gray>Sneak + right-click a frame<newline>with an empty hand to mark it.</gray>">Automark off</hover></yellow>'

tag-item:
  applied: '<prefix><green><hover:show_text:"<gray>In a frame it stands for the tag.</gray>">Tagged <white>#<tag></white></hover></green>'
  removed: '<prefix><gray>Tag removed</gray>'
  not-tagged: '<prefix><gray>That item has no tag</gray>'
  empty-hand: '<prefix><gray>Hold the item to tag</gray>'

where:
  empty-hand: '<prefix><gray>Hold the item to look up</gray>'
  no-source: '<prefix><gray><hover:show_text:"<gray>Only sorters and pads you may inspect:<newline>yours, or of players who trust you.</gray>">None in range</hover></gray>'

trace:
  started: '<prefix><green><hover:show_text:"<gray>Deliveries within <radius> blocks.<newline>Stop with <white><stop></white>.</gray>">Tracing for <seconds> s</hover></green>'
  stopped: '<prefix><gray>Tracing stopped.</gray>'
  not-running: '<prefix><gray>You are not tracing.</gray>'
  ended: '<prefix><gray>Tracing ended.</gray>'
  action-bar: '<prefix><white><amount>× <item></white> <dark_gray>→</dark_gray> <kind> <gray>(<x>, <y>, <z>)</gray>'
  kind:
    container: '<green>container</green>'
    dropped: '<yellow>dropped</yellow>'
    destroyed: '<red>lava</red>'

tag:
  title: '#<tag> <dark_gray>(<kind>)</dark_gray><apply>'
  apply-button: ' <hover:show_text:"<gray>Apply this tag to the item in your hand</gray>"><gradient:#F7B733:#FC4A1A>[Apply]</gradient></hover>'
  kind:
    item: 'item tag'
    block: 'block tag'
    custom: 'tags.yml tag'
  entry: '  <color:#F7B733>•</color> <white><item></white>'
  unknown: '<prefix><red>No tag <white>#<tag></white>.<hint></red>'
  unknown-hint: ' Try <usage>.'
  list:
    title: 'Tags'
    title-search: 'Tags containing "<text>"'
    entry: '  <color:#F7B733>•</color> <white>#<tag></white>'
    hover: '<gray>Click to see what this tag contains</gray>'

give:
  done: '<prefix><green>Gave <white><amount>× <item></white> to <white><player></white></green>'
  players-only: '<prefix><red>Name a player: <usage> ... [player]</red>'
  unavailable: '<prefix><red><hover:show_text:"<gray>Check its ID in the config,<newline>or wait for /ce reload to finish.</gray>">CraftEngine can''t build it now</hover></red>'
  unknown-pad: 'There is no pad type called ''<type>'''

trust:
  granted: '<prefix><green><hover:show_text:"<gray>Your sorters and pads also send<newline>to their frames.</gray>">You now trust <white><player></white></hover></green>'
  revoked: '<prefix><yellow><hover:show_text:"<gray>Your sorters and pads no longer<newline>send to their frames.</gray>">You no longer trust <white><player></white></hover></yellow>'
  already: '<prefix><gray>You already trust <white><player></white></gray>'
  not-trusted: '<prefix><gray>You don''t trust <white><player></white></gray>'
  unknown-player: '<prefix><red><white><player></white> never played here</red>'
  self: '<prefix><gray><hover:show_text:"<gray>Your own frames already receive<newline>from your sorters and pads.</gray>">You can''t trust yourself</hover></gray>'
  failed: '<prefix><red><hover:show_text:"<gray>If it keeps failing, ask an admin<newline>to check the console.</gray>">Not saved: try again</hover></red>'
  list:
    title: 'Trust'
    trusted: '  <color:#F7B733>→</color> <white><player></white> <dark_gray>trusted since <date></dark_gray>'
    trusting: '  <color:#F7B733>←</color> <white><player></white> <dark_gray>trusts you</dark_gray>'

sorter:
  created: '<prefix><green><hover:show_text:"<gray>Items in this dispenser now<newline>go to their target frames.</gray>">Sorter created</hover></green>'
  removed: '<prefix><yellow>Sorter removed</yellow>'

pad:
  created: '<prefix><green>Sorting pad <white><type></white> created</green>'
  removed: '<prefix><yellow>Sorting pad removed</yellow>'
  not-allowed: '<prefix><red>You can''t create pads here</red>'
  needs-base: '<prefix><red>A <white><type></white> pad goes on <white><base></white></red>'
  unavailable: '<prefix><red><hover:show_text:"<gray>CraftEngine can''t tell its blocks<newline>apart or build its items now.<newline>Wait for /ce reload to finish,<newline>or ask an admin.</gray>">Pads aren''t ready, try again</hover></red>'
