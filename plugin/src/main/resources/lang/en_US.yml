config-version: 1

prefix: '<white>[</white><gradient:#F7B733:#FC4A1A>FrameSort</gradient><white>]</white> '

command:
  help:
    layout:
      - ''
      - '<gradient:#F7B733:#FC4A1A>◤<st>                          </st></gradient> <prefix><gradient:#FC4A1A:#F7B733><st>                          </st>◥</gradient>'
      - ''
      - '   <color:#F7B733>•</color> <hover:show_text:"<gray>With an empty hand: its targets glow<newline>and are listed. Hold an item in your<newline>off hand to see only where it goes.</gray>"><white>Sneak + right-click</white> <gray>a sorter or pad</gray> <dark_gray>·</dark_gray> <gray>see its targets</gray></hover>'
      - '   <color:#F7B733>•</color> <hover:show_text:"<gray>With an empty hand: marks or<newline>unmarks it as a target.</gray>"><white>Sneak + right-click</white> <gray>a frame</gray> <dark_gray>·</dark_gray> <gray>mark it as a target</gray></hover>'
      - '   <color:#F7B733>•</color> <hover:show_text:"<gray>Shows what a frame accepts,<newline>who owns it and where items go.</gray>"><white>Sneak + left-click</white> <gray>a frame</gray> <dark_gray>·</dark_gray> <gray>see what it takes</gray></hover>'
      - ''
      - '<entries>'
      - ''
      - '<gradient:#F7B733:#FC4A1A>◣<st>                                   </st></gradient><gradient:#FC4A1A:#F7B733><st>                                  </st>◢</gradient>'
      - ''
    automark: '   <color:#F7B733>•</color> <hover:show_text:"<gray>Whether an item you put in a frame<newline>on a container marks it.</gray>"><white><usage></white> <dark_gray>·</dark_gray> <gray>when you fill a frame</gray></hover>'
    tag-list: '   <color:#F7B733>•</color> <hover:show_text:"<gray>Every item and block tag,<newline>and the tags in tags.yml.</gray>"><white><usage></white> <gray>[page]</gray> <dark_gray>·</dark_gray> <gray>all of them</gray></hover>'
    tag-search: '   <color:#F7B733>•</color> <hover:show_text:"<gray>Tags whose name contains a text.</gray>"><white><usage></white> <gray>\<text> [page]</gray> <dark_gray>·</dark_gray> <gray>find by name</gray></hover>'
    tag-show: '   <color:#F7B733>•</color> <hover:show_text:"<gray>The items or blocks in a tag.</gray>"><white><usage></white> <gray>\<tag> [page]</gray> <dark_gray>·</dark_gray> <gray>what''s inside</gray></hover>'
    tag-apply: '   <color:#F7B733>•</color> <hover:show_text:"<gray>The item in your hand stands for<newline>the tag when you put it in a frame.</gray>"><white><usage></white> <gray>\<tag></gray> <dark_gray>·</dark_gray> <gray>on the held item</gray></hover>'
    tag-remove: '   <color:#F7B733>•</color> <hover:show_text:"<gray>Takes the tag off the item in your hand.</gray>"><white><usage></white> <dark_gray>·</dark_gray> <gray>from the held item</gray></hover>'
    where: '   <color:#F7B733>•</color> <hover:show_text:"<gray>Where the item in your hand would go<newline>from the nearest sorter or pad.</gray>"><white><usage></white> <dark_gray>·</dark_gray> <gray>the held item''s route</gray></hover>'
    trace: '   <color:#F7B733>•</color> <hover:show_text:"<gray>Shows the deliveries around you<newline>for a while, or stops showing them.</gray>"><white><usage></white> <gray>[seconds|stop]</gray> <dark_gray>·</dark_gray> <gray>watch deliveries</gray></hover>'
    trust: '   <color:#F7B733>•</color> <hover:show_text:"<gray>Your sorters and pads also send<newline>to that player''s frames.</gray>"><white><usage></white> <gray>\<player></gray> <dark_gray>·</dark_gray> <gray>send to their frames</gray></hover>'
    untrust: '   <color:#F7B733>•</color> <hover:show_text:"<gray>Stops trusting a player.</gray>"><white><usage></white> <gray>\<player></gray> <dark_gray>·</dark_gray> <gray>stop sending to them</gray></hover>'
    trusted: '   <color:#F7B733>•</color> <hover:show_text:"<gray>Whom you trust and who trusts you.</gray>"><white><usage></white> <gray>[page]</gray> <dark_gray>·</dark_gray> <gray>who shares with whom</gray></hover>'
    give: '   <color:#F7B733>•</color> <hover:show_text:"<white><usage></white> <gray>sorter [player] [amount]</gray><newline><white><usage></white> <gray>pad \<type> [player] [amount]</gray><newline><gray>Gives sorter activators and pad blocks.</gray>"><white><usage></white> <gray>sorter|pad …</gray> <dark_gray>·</dark_gray> <gray>hand out items</gray></hover>'
    reload: '   <color:#F7B733>•</color> <hover:show_text:"<gray>config.yml, pads.yml, tags.yml<newline>and the language file.</gray>"><white><usage></white> <dark_gray>·</dark_gray> <gray>read the config again</gray></hover>'
  reloaded: '<prefix><white>Configuration <green>reloaded</green> in <ms> ms.</white>'
  reloaded-with-warnings: '<prefix><white>Configuration reloaded in <ms> ms with <hover:show_text:"<gray>Those settings use their defaults.<newline>See the console.</gray>"><yellow><count> warning(s)</yellow></hover>.</white>'
  reload-failed: '<prefix><white>Reload <red>failed</red>: <hover:show_text:"<gray><white><error></white><newline>The previous configuration is still active.</gray>">see the console</hover>.</white>'
  reload-running: '<prefix><white>A reload is <hover:show_text:"<gray>Try again when it ends.</gray>"><yellow>already running</yellow></hover>.</white>'
  players-only: '<prefix><white><red>Only players</red> can use this command.</white>'

