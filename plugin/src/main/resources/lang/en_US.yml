    last: '      <dark_gray>└</dark_gray> <entry>'
  excess:
    lava: '   <gray>Leftovers go to <red>lava</red></gray>'
    stay: '   <gray>Leftovers wait for room</gray>'
  target:
    dropped: '<yellow>dropped here</yellow>'
    lava: '<red>lava</red>'
  line: '   <color:#F7B733>•</color> <entry>'
  entry: '<white><item></white> <dark_gray>→</dark_gray> <hover:show_text:"<white><x>, <y>, <z></white>"><target></hover> <dark_gray><distance> m</dark_gray>'
  entry-same-item: '<hover:show_text:"<white><x>, <y>, <z></white>"><target></hover> <dark_gray><distance> m</dark_gray>'
  gone: '<prefix><white><hover:show_text:"<gray>It was removed, its chunk isn''t loaded,<newline>or you can''t see it any more.</gray>"><yellow>Out of date</yellow>: inspect it again</hover>.</white>'
  not-trusted: '<prefix><white><hover:show_text:"<gray>Only its owner and the players<newline>they trust can inspect it.</gray>"><red>Can''t inspect</red></hover> <player-head> <player>''s <source>.</white>'
  no-owner: '<prefix><white><hover:show_text:"<gray>Built before owners existed.<newline>Rebuild it to make it yours.</gray>">This <source> has <red>no owner</red></hover>.</white>'
  opens: '<prefix><white><hover:show_text:"<gray>The sorter sends what is inside first;<newline>once nothing inside can go anywhere,<newline>it sends it whole, as listed.</gray>">Opens <item> first</hover>.</white>'

