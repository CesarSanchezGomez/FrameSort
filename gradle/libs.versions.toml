# Every library and plugin version of the build. Constants that are not libraries (the Java and Minecraft versions)
# stay in gradle.properties.
[versions]
# The minimum supported Paper line: an exact build, never a dynamic version, which can resolve to a pre-release.
paper-api = "26.2.build.135-stable"
junit = "6.1.3"
# Optional integrations.
worldguard = "7.0.19"
craftengine = "26.9.1"
# Database. FrameSortLoader downloads these same HikariCP and MariaDB driver versions; its test checks them.
hikaricp = "7.1.0"
mariadb-java-client = "3.5.10"
# The drivers the server ships (Paper's paper-server/build.gradle.kts).
sqlite-jdbc = "3.49.1.0"
mysql-connector-j = "9.2.0"
testcontainers = "2.0.5"
# Static checks: NullAway turns the JSpecify annotations into compile errors, through Error Prone.
errorprone = "2.51.0"
nullaway = "0.14.3"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
worldguard-bukkit = { module = "com.sk89q.worldguard:worldguard-bukkit", version.ref = "worldguard" }
craftengine-core = { module = "net.momirealms:craft-engine-core", version.ref = "craftengine" }
craftengine-bukkit = { module = "net.momirealms:craft-engine-bukkit", version.ref = "craftengine" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
mariadb-java-client = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb-java-client" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
mysql-connector-j = { module = "com.mysql:mysql-connector-j", version.ref = "mysql-connector-j" }
testcontainers-mysql = { module = "org.testcontainers:testcontainers-mysql", version.ref = "testcontainers" }
testcontainers-mariadb = { module = "org.testcontainers:testcontainers-mariadb", version.ref = "testcontainers" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

[plugins]
run-paper = { id = "xyz.jpenilla.run-paper", version = "3.1.0" }
errorprone = { id = "net.ltgt.errorprone", version = "5.1.1" }
