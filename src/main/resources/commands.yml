# FrameSort: commands. Changes need a restart.
#
# Each section is one feature; its key is a fixed id, don't change it.
#   enabled     false removes the feature from every path.
#   permission  needed to see and run it. Empty means everyone. A permission FrameSort doesn't declare is
#               granted to ops only, unless a permissions plugin gives it.
#   usage       every full path that runs it. The first word is the root command, so a feature can also live
#               under its own command ('/fstrace'). The arguments follow the path, as in the comment above each one.
# Help lines in lang/ show the first path of each feature.

config-version: 1

# Usage: [COMMAND]
help:
  enabled: true
  permission: 'framesort.command.help'
  usage:
    - '/framesort'
    - '/fs'

# Usage: [COMMAND] [page]
tag-list:
  enabled: true
  permission: 'framesort.command.tag-list'
  usage:
    - '/framesort tag list'
    - '/fs tag list'

# Usage: [COMMAND] <text> [page]
tag-search:
  enabled: true
  permission: 'framesort.command.tag-search'
  usage:
    - '/framesort tag search'
    - '/fs tag search'

# Usage: [COMMAND] <tag> [page]
tag-show:
  enabled: true
  permission: 'framesort.command.tag-show'
  usage:
    - '/framesort tag show'
    - '/fs tag show'

# Usage: [COMMAND] <tag>   (with the item in your main hand)
tag-apply:
  enabled: true
  permission: 'framesort.command.tag-apply'
  usage:
    - '/framesort tag apply'
    - '/fs tag apply'

# Usage: [COMMAND]   (with the item in your main hand)
tag-remove:
  enabled: true
  permission: 'framesort.command.tag-remove'
  usage:
    - '/framesort tag remove'
    - '/fs tag remove'

# Usage: [COMMAND] (with the item in your main hand)
where:
  enabled: true
  permission: 'framesort.command.where'
  usage:
    - '/framesort where'
    - '/fs where'

# Usage: [COMMAND] [seconds] | [COMMAND] stop
trace:
  enabled: true
  permission: 'framesort.command.trace'
  usage:
    - '/framesort trace'
    - '/fs trace'

# Usage: [COMMAND] <page>
inspect:
  enabled: true
  permission: 'framesort.command.inspect'
  usage:
    - '/framesort inspect'
    - '/fs inspect'

# Usage: [COMMAND] sorter [player] [amount] | [COMMAND] pad <type> [player] [amount]
give:
  enabled: true
  permission: 'framesort.command.give'
  usage:
    - '/framesort give'
    - '/fs give'

# Usage: [COMMAND]
reload:
  enabled: true
  permission: 'framesort.command.reload'
  usage:
    - '/framesort reload'
    - '/fs reload'
