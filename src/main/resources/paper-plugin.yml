name: FrameSort
version: '${version}'
main: com.cesarcosmico.framesort.FrameSortPlugin
api-version: '26.2'
authors: [ CesarCosmico ]
description: 'Send items to item frames from sorter dispensers and teleport pads, without hopper chains.'
website: 'https://github.com/CesarSanchezGomez/Framesort'

dependencies:
  server:
    WorldGuard:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  framesort.*:
    description: 'Full access to FrameSort.'
    default: op
    children:
      framesort.use: true
      framesort.admin: true
  framesort.use:
    description: 'Player access (inspecting, target marking, tags, tracing).'
    default: true
    children:
      framesort.inspect: true
      framesort.target.create: true
      framesort.command.help: true
      framesort.command.tag-list: true
      framesort.command.tag-search: true
      framesort.command.tag-show: true
      framesort.command.tag-apply: true
      framesort.command.tag-remove: true
      framesort.command.trace: true
      framesort.command.inspect: true
      framesort.command.where: true
  framesort.admin:
    description: 'Administrator access (give items, reload, pads in permission mode).'
    default: op
    children:
      framesort.pad.create: true
      framesort.command.give: true
      framesort.command.reload: true
  framesort.inspect:
    description: 'Inspect sorters, pads and target frames by sneaking with an empty hand.'
    default: true
  framesort.target.create:
    description: 'Mark item frames as targets (targets.registration manual).'
    default: true
  framesort.pad.create:
    description: 'Create teleport pads when pads.yml has creation set to permission.'
    default: op
  framesort.command.help:
    description: 'Show the help with /framesort.'
    default: true
  framesort.command.tag-list:
    description: 'List every item and block tag with /framesort tag list.'
    default: true
  framesort.command.tag-search:
    description: 'Search tags by name with /framesort tag search.'
    default: true
  framesort.command.tag-show:
    description: 'Show what a tag contains with /framesort tag show.'
    default: true
  framesort.command.tag-apply:
    description: 'Apply a tag to the held item with /framesort tag apply.'
    default: true
  framesort.command.tag-remove:
    description: 'Take the tag off the held item with /framesort tag remove.'
    default: true
  framesort.command.trace:
    description: 'Trace nearby deliveries with /framesort trace.'
    default: true
  framesort.command.inspect:
    description: 'Page through inspection results with /framesort inspect.'
    default: true
  framesort.command.where:
    description: 'See where the held item would go from the nearest sorter or pad with /framesort where.'
    default: true
  framesort.command.give:
    description: 'Give sorter activators and pad blocks with /framesort give.'
    default: op
  framesort.command.reload:
    description: 'Reload the configuration with /framesort reload.'
    default: op
