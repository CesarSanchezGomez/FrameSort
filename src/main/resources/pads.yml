# FrameSort: sorting pads. /framesort reload applies this file.
# Details: https://github.com/CesarSanchezGomez/FrameSort/blob/main/docs/configuration.md#padsyml
#
# Each type under 'types' is one kind of pad; its key is the <type> of /framesort give pad.
#   structure             top and base, each a block a player can place or 'craftengine:<namespace>:<id>'.
#                         Items resting on the top go to the targets.
#   range                 blocks around the pad where its targets are searched.
#   pull-radius           blocks around the pad whose loose items it pulls onto itself, if it can see them; 0 = off.
#   takes-from-inventory  true: a player crouching on the pad sends a stack of their main inventory on every check
#                         (not the hotbar, armour or off hand).
#   item                  optional look of the top block /framesort give pad hands out: name, lore, glint.
# A pad is created when its top block is placed on its base.

config-version: 1

# Who creates pads: anyone, permission (framesort.pad.create) or item (only from /framesort give pad).
creation: anyone
# Ticks between checks for items resting on pads, loose items near them and players crouching on them.
sweep-interval: 10

# Copper turns into another block as it ages, which would end the pad: the copper pad uses waxed copper.
types:
  copper:
    structure: [WAXED_COPPER_GRATE, WAXED_COPPER_BLOCK]
    range: 64
    pull-radius: 4
    takes-from-inventory: false
    item:
      name: '<gradient:#F7B733:#FC4A1A>Copper Sorting Pad</gradient>'
      lore:
        - ''
        - ' <gray>Place it on top of a</gray> '
        - ' <gray>waxed block of copper.</gray> '
        - ''
      glint: true
  lodestone:
    structure: [LODESTONE, SMOOTH_STONE]
    range: 64
    pull-radius: 4
    takes-from-inventory: false
    item:
      name: '<gradient:#F7B733:#FC4A1A>Lodestone Sorting Pad</gradient>'
      lore:
        - ''
        - ' <gray>Place it on top of</gray> '
        - ' <gray>smooth stone.</gray> '
        - ''
      glint: true
  tuff:
    structure: [CHISELED_TUFF, POLISHED_TUFF]
    range: 64
    pull-radius: 0
    takes-from-inventory: true
    item:
      name: '<gradient:#F7B733:#FC4A1A>Tuff Sorting Pad</gradient>'
      lore:
        - ''
        - ' <gray>Place it on top of</gray> '
        - ' <gray>polished tuff.</gray> '
        - ''
        - ' <gray>Crouch on it to send</gray> '
        - ' <gray>your inventory.</gray> '
        - ''
      glint: true
