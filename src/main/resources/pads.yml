# FrameSort: sorting pads. /framesort reload applies this file.
# Details: https://github.com/CesarSanchezGomez/FrameSort/blob/main/docs/configuration.md#padsyml
#
# Each type under 'types' is one kind of pad; its key is the <type> of /framesort give pad.
#   structure  top and base, each a block a player can place or 'craftengine:<namespace>:<id>'.
#              Items resting on the top go to the targets.
#   item       optional look of the top block /framesort give pad hands out: name, lore, glint.
# A pad is created when its top block is placed on its base.

config-version: 1

# Who creates pads: anyone, permission (framesort.pad.create) or item (only from /framesort give pad).
creation: anyone
# Ticks between checks for items resting on pads.
sweep-interval: 10

# Copper turns into another block as it ages, which would end the pad: these use waxed copper.
types:
  copper:
    structure: [WAXED_COPPER_GRATE, LODESTONE]
    item:
      name: '<gradient:#F7B733:#FC4A1A>Sorting Pad</gradient>'
      lore:
        - ''
        - ' <gray>Place it on top of</gray> '
        - ' <gray>a lodestone.</gray> '
        - ''
      glint: true
  oxidized:
    structure: [WAXED_OXIDIZED_COPPER_GRATE, LODESTONE]
    item:
      name: '<gradient:#F7B733:#FC4A1A>Oxidized Sorting Pad</gradient>'
      lore:
        - ''
        - ' <gray>Place it on top of</gray> '
        - ' <gray>a lodestone.</gray> '
        - ''
      glint: true
