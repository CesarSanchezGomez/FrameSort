# FrameSort: teleport pads. A pad is created when its top block is placed on the rest of the column.

config-version: 1

creation: anyone   # anyone | permission | item
sweep-interval: 10   # ticks

types:
  simple:
    structure: [CRYING_OBSIDIAN, GILDED_BLACKSTONE]   # top to bottom
    item:
      name: '<gradient:#F7B733:#FC4A1A>Teleport Pad</gradient>'
      lore:
        - ''
        - ' <gray>Place it on top of</gray> '
        - ' <gray>gilded blackstone.</gray> '
        - ''
      glint: true
      item-model: ''
  magma:
    structure: [MAGMA_BLOCK, CRYING_OBSIDIAN, GILDED_BLACKSTONE]
    item:
      name: '<gradient:#F7B733:#FC4A1A>Magma Teleport Pad</gradient>'
      lore:
        - ''
        - ' <gray>Place it on crying obsidian</gray> '
        - ' <gray>over gilded blackstone.</gray> '
        - ''
      glint: true
      item-model: ''
