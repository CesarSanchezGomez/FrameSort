# Database connection. Read on start only: changes need a server restart.

config-version: 1

# sqlite keeps the data in a file inside this folder; mysql and mariadb use the 'remote' server.
type: 'sqlite'

sqlite:
  file: 'data.db'

# MySQL or MariaDB server.
remote:
  host: 'localhost'
  port: 3306
  database: 'framesort'
  username: 'root'
  password: ''
  # Extra JDBC URL parameters, such as 'sslMode=REQUIRED'. Empty: the driver's defaults (MySQL uses TLS when it can).
  properties: ''
