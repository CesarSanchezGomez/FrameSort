config-version: 1

prefix: '<white>[</white><gradient:#F7B733:#FC4A1A>FrameSort</gradient><white>]</white> '

command:
  help:
    header:
      - '<prefix><gray>Sort items into item frames.</gray>'
      - '<gray>• <white>Sneak + right-click</white> a sorter or pad with an empty hand to see its targets (hold an item in your off hand to see only its targets).</gray>'
      - '<gray>• <white>Sneak + right-click</white> a frame with an empty hand to mark it as a target; <white>sneak + left-click</white> it to see what it accepts.</gray>'
    tag-list: '<gray>• <white><usage> [page]</white> <dark_gray>-</dark_gray> every item and block tag, and those in tags.yml.</gray>'
    tag-search: '<gray>• <white><usage> \<text> [page]</white> <dark_gray>-</dark_gray> tags whose name contains a text.</gray>'
    tag-show: '<gray>• <white><usage> \<tag> [page]</white> <dark_gray>-</dark_gray> what a tag contains.</gray>'
    tag-apply: '<gray>• <white><usage> \<tag></white> <dark_gray>-</dark_gray> apply a tag to the item in your hand.</gray>'
    tag-remove: '<gray>• <white><usage></white> <dark_gray>-</dark_gray> take the tag off the item in your hand.</gray>'
    where: '<gray>• <white><usage></white> <dark_gray>-</dark_gray> where the item in your hand would go from the nearest sorter or pad.</gray>'
    trace: '<gray>• <white><usage> [seconds|stop]</white> <dark_gray>-</dark_gray> show the deliveries around you.</gray>'
    trust: '<gray>• <white><usage> \<player></white> <dark_gray>-</dark_gray> let a player''s frames receive from your sorters and pads.</gray>'
    untrust: '<gray>• <white><usage> \<player></white> <dark_gray>-</dark_gray> stop trusting a player.</gray>'
    trust-list: '<gray>• <white><usage> [page]</white> <dark_gray>-</dark_gray> whom you trust and who trusts you.</gray>'
    give: '<gray>• <white><usage> sorter|pad \<type> [player] [amount]</white> <dark_gray>-</dark_gray> give sorter activators and pad blocks.</gray>'
    reload: '<gray>• <white><usage></white> <dark_gray>-</dark_gray> reload the configuration.</gray>'
  reloaded: '<prefix><green>Configuration reloaded.</green>'
  reloaded-with-warnings: '<prefix><yellow>Configuration reloaded with <count> warning(s): those settings use their defaults. See the console.</yellow>'
  reload-failed: '<prefix><red>Reload failed: <error>. The previous configuration is still active; see the console.</red>'
  players-only: '<prefix><red>Only players can use this command.</red>'

pager:
  layout:
    - ''
    - '<gradient:#F7B733:#FC4A1A>◤<st>                          </st></gradient> <prefix><gradient:#FC4A1A:#F7B733><st>                          </st>◥</gradient>'
    - ''
    - '  <white><title></white> <dark_gray>·</dark_gray> <gray><total></gray>'
    - ''
    - '<entries>'
    - ''
    - '<gradient:#F7B733:#FC4A1A>◣<st>                         </st></gradient> <previous> <white>| <page>—<pages> |</white> <next> <gradient:#FC4A1A:#F7B733><st>                         </st>◢</gradient>'
    - ''
  empty: '<gray>  Nothing to show.</gray>'
  previous:
    enabled: '<hover:show_text:"<gray>Click to go to page <page></gray>"><gradient:#F7B733:#FC4A1A>«</gradient></hover>'
    disabled: '<dark_gray>«</dark_gray>'
  next:
    enabled: '<hover:show_text:"<gray>Click to go to page <page></gray>"><gradient:#FC4A1A:#F7B733>»</gradient></hover>'
    disabled: '<dark_gray>»</dark_gray>'

inspect:
  source:
    sorter: 'sorter'
    pad: 'teleport pad'
  title: 'Targets of this <source> (<x>, <y>, <z>)<sorted><owner>'
  title-item: 'Where <item> goes from this <source><sorted><owner>'
  sorted: ' <dark_gray>· <count> sorted</dark_gray>'
  owner: ' <dark_gray>· <player>''s</dark_gray>'
  level:
    first: '  <color:#F7B733><number>.</color> <white>First choice</white>'
    next: '  <color:#F7B733><number>.</color> <white>When those are full</white>'
  branch:
    middle: '     <dark_gray>├</dark_gray> <entry>'
    last: '     <dark_gray>└</dark_gray> <entry>'
  excess:
    lava: '  <red>Anything left over is destroyed by lava.</red>'
    stay: '  <gray>Anything left over stays until there is room.</gray>'
  target:
    dropped: '<yellow>dropped here</yellow>'
    lava: '<red>lava</red>'
  line: '  <color:#F7B733>•</color> <entry>'
  entry: '<white><item></white> <dark_gray>→</dark_gray> <hover:show_text:"<gray><x>, <y>, <z></gray>"><target></hover> <dark_gray><distance> m</dark_gray>'
  no-listing: '<prefix><gray>Sneak + right-click a sorter or pad with an empty hand first.</gray>'
  not-trusted: '<prefix><red>This <source> belongs to <white><player></white>, who doesn''t trust you.</red>'
  no-owner: '<prefix><red>This <source> belongs to nobody yet: rebuild it to make it yours.</red>'
  opens: '<prefix><gray>A sorter opens <white><item></white> first and sends what is inside; once nothing inside can go anywhere, it goes whole, as listed below.</gray>'

frame:
  layout:
    - ''
    - '<gradient:#F7B733:#FC4A1A>◤<st>                          </st></gradient> <prefix><gradient:#FC4A1A:#F7B733><st>                          </st>◥</gradient>'
    - ''
    - '  <title>'
    - ''
    - '<lines>'
    - ''
    - '<gradient:#F7B733:#FC4A1A>◣<st>                                   </st></gradient><gradient:#FC4A1A:#F7B733><st>                                   </st>◢</gradient>'
    - ''
  title: '<white>Target frame</white> <dark_gray>(<x>, <y>, <z>)</dark_gray>'
  status:
    target: '  <green>✔</green> <gray>A target</gray>'
    unmarked: '  <yellow>✘</yellow> <gray>Not a target yet: sneak + right-click it with an empty hand</gray>'
    wrong-type: '  <red>✘</red> <gray>This kind of frame can''t be a target</gray>'
  owner: '  <color:#F7B733>•</color> <gray>Owner:</gray> <white><player></white>'
  no-owner: '  <color:#F7B733>•</color> <gray>No owner yet: whoever marks it first gets it</gray>'
  into:
    container: '  <color:#F7B733>•</color> <gray>Items go into</gray> <white><block></white>'
    dropped: '  <color:#F7B733>•</color> <gray>Items are</gray> <yellow>dropped in front of it</yellow>'
    lava: '  <color:#F7B733>•</color> <gray>Items are</gray> <red>destroyed by lava</red>'
  accepts:
    exact: '  <color:#F7B733>•</color> <gray>Accepts</gray> <white><item></white> <dark_gray>exact match first</dark_gray>'
    tag: '  <color:#F7B733>•</color> <gray>Accepts</gray> <white>#<tag></white> <dark_gray>· <count> items · [click to list]</dark_gray>'
    contents: '  <color:#F7B733>•</color> <gray>Accepts what it holds</gray> <dark_gray>· <count> stacks</dark_gray>'
    similar: '  <color:#F7B733>•</color> <gray>Accepts any</gray> <white><material></white> <dark_gray>when nothing matches better</dark_gray>'
    custom: '  <color:#F7B733>•</color> <gray>Accepts any</gray> <white><id></white> <dark_gray>when nothing matches better</dark_gray>'
    default: '  <color:#F7B733>•</color> <gray>Default target:</gray> <white>whatever matches no other frame, or has no room left in one</white>'
  on-sorter: '  <color:#F7B733>•</color> <gray>On a sorter: only teleport pads send here</gray>'
  sources: '  <color:#F7B733>•</color> <gray>Sorters and pads in range:</gray> <white><count></white>'

mark:
  marked: '<prefix><green>This frame is now a target.</green>'
  unmarked: '<prefix><yellow>This frame is no longer a target.</yellow>'
  automatic: '<prefix><gray>Every frame is a target already on this server.</gray>'
  no-permission: '<prefix><red>You can''t mark target frames.</red>'
  wrong-type: '<prefix><red>This kind of frame can''t be a target.</red>'
  not-yours: '<prefix><red>This frame belongs to <white><player></white>: only they can mark or unmark it.</red>'

tag-item:
  applied: '<prefix><green>The item in your hand now stands for <white>#<tag></white> in frames.</green>'
  removed: '<prefix><gray>The item in your hand no longer has a tag.</gray>'
  not-tagged: '<prefix><gray>The item in your hand has no tag.</gray>'
  empty-hand: '<prefix><gray>Hold the item you want to apply the tag to.</gray>'

where:
  empty-hand: '<prefix><gray>Hold the item you want to look up.</gray>'
  no-source: '<prefix><gray>There is no sorter or pad of yours, or of someone who trusts you, within <radius> blocks.</gray>'

trace:
  started: '<prefix><green>Tracing deliveries within <radius> blocks for <seconds> seconds.</green> <gray>Stop with <stop>.</gray>'
  stopped: '<prefix><gray>Tracing stopped.</gray>'
  not-running: '<prefix><gray>You are not tracing.</gray>'
  ended: '<prefix><gray>Tracing ended.</gray>'
  action-bar: '<white><amount>× <item></white> <dark_gray>→</dark_gray> <kind> <gray>(<x>, <y>, <z>)</gray>'
  kind:
    container: '<green>container</green>'
    dropped: '<yellow>dropped</yellow>'
    destroyed: '<red>lava</red>'

tag:
  title: '#<tag> <dark_gray>(<kind>)</dark_gray><apply>'
  apply-button: ' <hover:show_text:"<gray>Apply this tag to the item in your hand</gray>"><gradient:#F7B733:#FC4A1A>[Apply]</gradient></hover>'
  kind:
    item: 'item tag'
    block: 'block tag'
    custom: 'tags.yml tag'
  entry: '  <color:#F7B733>•</color> <white><item></white>'
  unknown: '<prefix><red>There is no tag called <white>#<tag></white>.<hint></red>'
  unknown-hint: ' Try <usage>.'
  list:
    title: 'Tags'
    title-search: 'Tags containing "<text>"'
    entry: '  <color:#F7B733>•</color> <white>#<tag></white>'
    hover: '<gray>Click to see what this tag contains</gray>'

give:
  done: '<prefix><green>Gave <white><amount>× <item></white> to <white><player></white>.</green>'
  players-only: '<prefix><red>Name a player: <usage> ... [player]</red>'
  unavailable: '<prefix><red>CraftEngine can''t build that item right now: check its ID in the config, or wait for /ce reload to finish.</red>'
  unknown-pad: 'There is no pad type called ''<type>'''

trust:
  granted: '<prefix><green>Your sorters and pads now also send to <white><player></white>''s frames.</green>'
  revoked: '<prefix><yellow>Your sorters and pads no longer send to <white><player></white>''s frames.</yellow>'
  already: '<prefix><gray>You already trust <white><player></white>.</gray>'
  not-trusted: '<prefix><gray>You don''t trust <white><player></white>.</gray>'
  unknown-player: '<prefix><red><white><player></white> has never played on this server.</red>'
  self: '<prefix><gray>Your own frames already receive from your sorters and pads.</gray>'
  failed: '<prefix><red>That could not be saved. Try again, or ask an admin to check the console.</red>'
  disabled: '<prefix><gray>Sorters and pads have no owners on this server: they send to every frame.</gray>'
  list:
    title: 'Trust'
    trusted: '  <color:#F7B733>→</color> <white><player></white> <dark_gray>you trust them since <date></dark_gray>'
    trusting: '  <color:#F7B733>←</color> <white><player></white> <dark_gray>trusts you</dark_gray>'

sorter:
  created: '<prefix><green>Sorter created.</green> <gray>Items in this dispenser now go to their target frames.</gray>'
  removed: '<prefix><yellow>Sorter removed.</yellow>'

pad:
  created: '<prefix><green>Teleport pad <white><type></white> created.</green>'
  not-allowed: '<prefix><red>You can''t create teleport pads here.</red>'
  unavailable: '<prefix><red>CraftEngine can''t build this pad''s item right now, so the pad can''t be broken yet: wait for /ce reload to finish, or ask an admin.</red>'
