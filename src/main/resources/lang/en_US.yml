config-version: 1

prefix: '<white>[</white><gradient:#F7B733:#FC4A1A>FrameSort</gradient><white>]</white> '

command:
  help:
    header:
      - '<prefix><gray>Sort items into item frames.</gray>'
      - '<gray>• <white>Sneak + right-click</white> a sorter or pad with an empty hand to see its targets (hold an item in your off hand to see only its targets).</gray>'
      - '<gray>• <white>Sneak + right-click</white> a frame with an empty hand to mark it as a target; <white>sneak + left-click</white> it to see what it accepts.</gray>'
    tag: '<gray>• <white><usage> \<tag> [page]</white> <dark_gray>-</dark_gray> what an item or block tag contains.</gray>'
    tags: '<gray>• <white><usage> [page]</white> · <white><usage> search \<text> [page]</white> <dark_gray>-</dark_gray> item and block tags.</gray>'
    filter: '<gray>• <white><usage> \<tag></white> · <white><usage> clear</white> <dark_gray>-</dark_gray> make the item in your hand a tag filter for frames.</gray>'
    where: '<gray>• <white><usage></white> <dark_gray>-</dark_gray> where the item in your hand would go from the nearest sorter or pad.</gray>'
    trace: '<gray>• <white><usage> [seconds|stop]</white> <dark_gray>-</dark_gray> show the deliveries around you.</gray>'
    give: '<gray>• <white><usage> sorter|pad \<type> [player] [amount]</white> <dark_gray>-</dark_gray> give sorter activators and pad blocks.</gray>'
    reload: '<gray>• <white><usage></white> <dark_gray>-</dark_gray> reload the configuration.</gray>'
  reloaded: '<prefix><green>Configuration reloaded.</green>'
  reloaded-with-warnings: '<prefix><yellow>Configuration reloaded with <count> warning(s): those settings use their defaults. See the console.</yellow>'
  reload-failed: '<prefix><red>Reload failed: <error>. The previous configuration is still active; see the console.</red>'
  players-only: '<prefix><red>Only players can use this command.</red>'

pager:
  layout:
    - ''
    - '<gradient:#F7B733:#FC4A1A>◤<st>                          </st></gradient> <white>[</white><gradient:#F7B733:#FC4A1A>FrameSort</gradient><white>]</white> <gradient:#FC4A1A:#F7B733><st>                          </st>◥</gradient>'
    - ''
    - '  <white><title></white> <dark_gray>·</dark_gray> <gray><total></gray>'
    - ''
    - '<entries>'
    - ''
    - '<gradient:#F7B733:#FC4A1A>◣<st>                         </st></gradient> <previous> <white>| <page>—<pages> |</white> <next> <gradient:#FC4A1A:#F7B733><st>                         </st>◢</gradient>'
    - ''
  empty: '<gray>  Nothing to show.</gray>'
  previous:
    enabled: '<hover:show_text:"<gray>Click to go to page <page></gray>"><gradient:#F7B733:#FC4A1A>«</gradient></hover>'
    disabled: '<dark_gray>«</dark_gray>'
  next:
    enabled: '<hover:show_text:"<gray>Click to go to page <page></gray>"><gradient:#FC4A1A:#F7B733>»</gradient></hover>'
    disabled: '<dark_gray>»</dark_gray>'

inspect:
  source:
    sorter: 'sorter'
    pad: 'teleport pad'
  title: 'Targets of this <source> (<x>, <y>, <z>)<sorted>'
  title-item: 'Where <item> goes from this <source><sorted>'
  sorted: ' <dark_gray>· <count> sorted</dark_gray>'
  section:
    containers: '  <green>Into containers:</green>'
    dropped: '  <yellow>Dropped at:</yellow>'
  excess:
    lava: '  <red>Anything left over is destroyed by lava.</red>'
    stay: '  <gray>Anything left over stays until there is room.</gray>'
  target:
    dropped: '<yellow>dropped here</yellow>'
    lava: '<red>lava</red>'
  line: '  <color:#F7B733>•</color> <white><item></white> <dark_gray>→</dark_gray> <hover:show_text:"<gray><x>, <y>, <z></gray>"><target></hover> <dark_gray><distance> m</dark_gray>'
  no-listing: '<prefix><gray>Sneak + right-click a sorter or pad with an empty hand first.</gray>'

frame:
  layout:
    - ''
    - '<gradient:#F7B733:#FC4A1A>◤<st>                          </st></gradient> <white>[</white><gradient:#F7B733:#FC4A1A>FrameSort</gradient><white>]</white> <gradient:#FC4A1A:#F7B733><st>                          </st>◥</gradient>'
    - ''
    - '  <title>'
    - ''
    - '<lines>'
    - ''
    - '<gradient:#F7B733:#FC4A1A>◣<st>                                   </st></gradient><gradient:#FC4A1A:#F7B733><st>                                   </st>◢</gradient>'
    - ''
  title: '<white>Target frame</white> <dark_gray>(<x>, <y>, <z>)</dark_gray>'
  status:
    target: '  <green>✔</green> <gray>A target, on the <position> of its block</gray>'
    unmarked: '  <yellow>✘</yellow> <gray>Not a target yet: sneak + right-click it with an empty hand</gray>'
    not-allowed: '  <red>✘</red> <gray>Frames can''t be targets on the <position> of a block here</gray>'
    wrong-type: '  <red>✘</red> <gray>This kind of frame can''t be a target</gray>'
  into:
    container: '  <color:#F7B733>•</color> <gray>Items go into</gray> <white><block></white>'
    dropped: '  <color:#F7B733>•</color> <gray>Items are</gray> <yellow>dropped in front of it</yellow>'
    lava: '  <color:#F7B733>•</color> <gray>Items are</gray> <red>destroyed by lava</red>'
  accepts:
    exact: '  <color:#F7B733>•</color> <gray>Accepts</gray> <white><item></white> <dark_gray>exact match first</dark_gray>'
    tag: '  <color:#F7B733>•</color> <gray>Accepts</gray> <white>#<tag></white> <dark_gray>· <count> items · [click to list]</dark_gray>'
    contents: '  <color:#F7B733>•</color> <gray>Accepts what it holds</gray> <dark_gray>· <count> stacks</dark_gray>'
    similar: '  <color:#F7B733>•</color> <gray>Accepts any</gray> <white><material></white> <dark_gray>when nothing matches better</dark_gray>'
    default: '  <color:#F7B733>•</color> <gray>Default target:</gray> <white>whatever matches no other frame</white>'
  sources: '  <color:#F7B733>•</color> <gray>Sorters and pads in range:</gray> <white><count></white>'

mark:
  marked: '<prefix><green>This frame is now a target.</green>'
  unmarked: '<prefix><yellow>This frame is no longer a target.</yellow>'
  automatic: '<prefix><gray>Every frame is a target already on this server.</gray>'
  no-permission: '<prefix><red>You can''t mark target frames.</red>'
  wrong-type: '<prefix><red>This kind of frame can''t be a target.</red>'
  wrong-position: '<prefix><red>Target frames can''t go on the <position> of a block here. Allowed: <allowed>.</red>'

position:
  top: 'top'
  bottom: 'bottom'
  front: 'front'
  back: 'back'
  left: 'left'
  right: 'right'
  side: 'side'

filter:
  set: '<prefix><green>The item in your hand is now a filter for <white>#<tag></white>.</green>'
  cleared: '<prefix><gray>The item in your hand is no longer a filter.</gray>'
  not-a-filter: '<prefix><gray>The item in your hand is not a filter.</gray>'
  empty-hand: '<prefix><gray>Hold the item you want to turn into a filter.</gray>'

where:
  empty-hand: '<prefix><gray>Hold the item you want to look up.</gray>'
  no-source: '<prefix><gray>There is no sorter or pad within <radius> blocks.</gray>'

trace:
  started: '<prefix><green>Tracing deliveries within <radius> blocks for <seconds> seconds.</green> <gray>Stop with /framesort trace stop.</gray>'
  stopped: '<prefix><gray>Tracing stopped.</gray>'
  not-running: '<prefix><gray>You are not tracing.</gray>'
  ended: '<prefix><gray>Tracing ended.</gray>'
  action-bar: '<white><amount>× <item></white> <dark_gray>→</dark_gray> <kind> <gray>(<x>, <y>, <z>)</gray>'
  kind:
    container: '<green>container</green>'
    dropped: '<yellow>dropped</yellow>'
    destroyed: '<red>lava</red>'

tag:
  title: '#<tag> <dark_gray>(<kind>)</dark_gray>'
  kind:
    item: 'item tag'
    block: 'block tag'
  entry: '  <color:#F7B733>•</color> <white><item></white>'
  unknown: '<prefix><red>There is no item or block tag called <white>#<tag></white>. Try /framesort tags.</red>'

tags:
  title: 'Tags'
  title-search: 'Tags containing "<text>"'
  entry: '  <color:#F7B733>•</color> <white>#<tag></white>'
  hover: '<gray>Click to see what this tag contains</gray>'

give:
  done: '<prefix><green>Gave <white><amount>× <item></white> to <white><player></white>.</green>'
  players-only: '<prefix><red>Name a player: /framesort give ... [player]</red>'
  unknown-pad: 'There is no pad type called ''<type>'''

pad:
  created: '<prefix><green>Teleport pad <white><type></white> created.</green>'
  not-allowed: '<prefix><red>You can''t create teleport pads here.</red>'
