config-version: 1

prefix: '<white>[</white><gradient:#F7B733:#FC4A1A>FrameSort</gradient><white>]</white> '

command:
  help:
    header:
      - '<prefix><gray>Ordena items en marcos.</gray>'
      - '<gray>• <white>Shift + clic derecho</white> a un sorter o pad con la mano vacía para ver sus destinos (con un item en la otra mano, solo los de ese item).</gray>'
      - '<gray>• <white>Shift + clic derecho</white> a un marco con la mano vacía para marcarlo como destino; <white>shift + clic izquierdo</white> para ver qué acepta.</gray>'
    tag:
      - '<gray>• <white><usage> list [página]</white> · <white><usage> search \<texto> [página]</white> <dark_gray>-</dark_gray> tags de items y bloques.</gray>'
      - '<gray>• <white><usage> show \<tag> [página]</white> <dark_gray>-</dark_gray> qué contiene un tag.</gray>'
      - '<gray>• <white><usage> apply \<tag></white> · <white><usage> remove</white> <dark_gray>-</dark_gray> aplica un tag al item de tu mano, o se lo quita.</gray>'
    where: '<gray>• <white><usage></white> <dark_gray>-</dark_gray> adónde iría el item de tu mano desde el sorter o pad más cercano.</gray>'
    trace: '<gray>• <white><usage> [segundos|stop]</white> <dark_gray>-</dark_gray> muestra las entregas a tu alrededor.</gray>'
    give: '<gray>• <white><usage> sorter|pad \<tipo> [jugador] [cantidad]</white> <dark_gray>-</dark_gray> da activadores de sorter y bloques de pad.</gray>'
    reload: '<gray>• <white><usage></white> <dark_gray>-</dark_gray> recarga la configuración.</gray>'
  reloaded: '<prefix><green>Configuración recargada.</green>'
  reloaded-with-warnings: '<prefix><yellow>Configuración recargada con <count> aviso(s): esos ajustes usan su valor por defecto. Mira la consola.</yellow>'
  reload-failed: '<prefix><red>La recarga falló: <error>. Sigue activa la configuración anterior; mira la consola.</red>'
  players-only: '<prefix><red>Solo los jugadores pueden usar este comando.</red>'

pager:
  layout:
    - ''
    - '<gradient:#F7B733:#FC4A1A>◤<st>                          </st></gradient> <white>[</white><gradient:#F7B733:#FC4A1A>FrameSort</gradient><white>]</white> <gradient:#FC4A1A:#F7B733><st>                          </st>◥</gradient>'
    - ''
    - '  <white><title></white> <dark_gray>·</dark_gray> <gray><total></gray>'
    - ''
    - '<entries>'
    - ''
    - '<gradient:#F7B733:#FC4A1A>◣<st>                         </st></gradient> <previous> <white>| <page>—<pages> |</white> <next> <gradient:#FC4A1A:#F7B733><st>                         </st>◢</gradient>'
    - ''
  empty: '<gray>  No hay nada que mostrar.</gray>'
  previous:
    enabled: '<hover:show_text:"<gray>Clic para ir a la página <page></gray>"><gradient:#F7B733:#FC4A1A>«</gradient></hover>'
    disabled: '<dark_gray>«</dark_gray>'
  next:
    enabled: '<hover:show_text:"<gray>Clic para ir a la página <page></gray>"><gradient:#FC4A1A:#F7B733>»</gradient></hover>'
    disabled: '<dark_gray>»</dark_gray>'

inspect:
  source:
    sorter: 'sorter'
    pad: 'teleport pad'
  title: 'Destinos de este <source> (<x>, <y>, <z>)<sorted>'
  title-item: 'Adónde va <item> desde este <source><sorted>'
  sorted: ' <dark_gray>· <count> enviados</dark_gray>'
  section:
    containers: '  <green>A contenedores:</green>'
    dropped: '  <yellow>Se suelta en:</yellow>'
  excess:
    lava: '  <red>Lo que sobre se destruye en la lava.</red>'
    stay: '  <gray>Lo que sobre se queda hasta que haya sitio.</gray>'
  target:
    dropped: '<yellow>se suelta aquí</yellow>'
    lava: '<red>lava</red>'
  line: '  <color:#F7B733>•</color> <white><item></white> <dark_gray>→</dark_gray> <hover:show_text:"<gray><x>, <y>, <z></gray>"><target></hover> <dark_gray><distance> m</dark_gray>'
  no-listing: '<prefix><gray>Primero haz shift + clic derecho a un sorter o pad con la mano vacía.</gray>'

frame:
  layout:
    - ''
    - '<gradient:#F7B733:#FC4A1A>◤<st>                          </st></gradient> <white>[</white><gradient:#F7B733:#FC4A1A>FrameSort</gradient><white>]</white> <gradient:#FC4A1A:#F7B733><st>                          </st>◥</gradient>'
    - ''
    - '  <title>'
    - ''
    - '<lines>'
    - ''
    - '<gradient:#F7B733:#FC4A1A>◣<st>                                   </st></gradient><gradient:#FC4A1A:#F7B733><st>                                   </st>◢</gradient>'
    - ''
  title: '<white>Marco destino</white> <dark_gray>(<x>, <y>, <z>)</dark_gray>'
  status:
    target: '  <green>✔</green> <gray>Es un destino, en la cara <position> de su bloque</gray>'
    unmarked: '  <yellow>✘</yellow> <gray>Aún no es destino: shift + clic derecho con la mano vacía</gray>'
    not-allowed: '  <red>✘</red> <gray>Aquí no se permiten destinos en la cara <position> de un bloque</gray>'
    wrong-type: '  <red>✘</red> <gray>Este tipo de marco no puede ser destino</gray>'
  into:
    container: '  <color:#F7B733>•</color> <gray>Los items van a</gray> <white><block></white>'
    dropped: '  <color:#F7B733>•</color> <gray>Los items</gray> <yellow>se sueltan delante</yellow>'
    lava: '  <color:#F7B733>•</color> <gray>Los items se</gray> <red>destruyen en la lava</red>'
  accepts:
    exact: '  <color:#F7B733>•</color> <gray>Acepta</gray> <white><item></white> <dark_gray>primero la coincidencia exacta</dark_gray>'
    tag: '  <color:#F7B733>•</color> <gray>Acepta</gray> <white>#<tag></white> <dark_gray>· <count> items · [clic para ver]</dark_gray>'
    contents: '  <color:#F7B733>•</color> <gray>Acepta lo que contiene</gray> <dark_gray>· <count> stacks</dark_gray>'
    similar: '  <color:#F7B733>•</color> <gray>Acepta cualquier</gray> <white><material></white> <dark_gray>si nada coincide mejor</dark_gray>'
    default: '  <color:#F7B733>•</color> <gray>Destino por defecto:</gray> <white>lo que no encaja en ningún otro marco</white>'
  sources: '  <color:#F7B733>•</color> <gray>Sorters y pads al alcance:</gray> <white><count></white>'

mark:
  marked: '<prefix><green>Este marco ahora es un destino.</green>'
  unmarked: '<prefix><yellow>Este marco ya no es un destino.</yellow>'
  automatic: '<prefix><gray>En este servidor todos los marcos ya son destinos.</gray>'
  no-permission: '<prefix><red>No puedes marcar marcos como destino.</red>'
  wrong-type: '<prefix><red>Este tipo de marco no puede ser destino.</red>'
  wrong-position: '<prefix><red>Aquí los destinos no pueden ir en la cara <position> de un bloque. Permitidas: <allowed>.</red>'

position:
  top: 'superior'
  bottom: 'inferior'
  front: 'frontal'
  back: 'trasera'
  left: 'izquierda'
  right: 'derecha'
  side: 'lateral'

tag-item:
  applied: '<prefix><green>El item de tu mano ahora representa <white>#<tag></white> en los marcos.</green>'
  removed: '<prefix><gray>El item de tu mano ya no tiene tag.</gray>'
  not-tagged: '<prefix><gray>El item de tu mano no tiene tag.</gray>'
  empty-hand: '<prefix><gray>Sujeta el item al que quieres aplicar el tag.</gray>'

where:
  empty-hand: '<prefix><gray>Sujeta el item que quieres consultar.</gray>'
  no-source: '<prefix><gray>No hay ningún sorter ni pad a menos de <radius> bloques.</gray>'

trace:
  started: '<prefix><green>Rastreando entregas a menos de <radius> bloques durante <seconds> segundos.</green> <gray>Para con /framesort trace stop.</gray>'
  stopped: '<prefix><gray>Rastreo detenido.</gray>'
  not-running: '<prefix><gray>No estás rastreando.</gray>'
  ended: '<prefix><gray>El rastreo ha terminado.</gray>'
  action-bar: '<white><amount>× <item></white> <dark_gray>→</dark_gray> <kind> <gray>(<x>, <y>, <z>)</gray>'
  kind:
    container: '<green>contenedor</green>'
    dropped: '<yellow>suelto</yellow>'
    destroyed: '<red>lava</red>'

tag:
  title: '#<tag> <dark_gray>(<kind>)</dark_gray> <apply>'
  apply-button: '<hover:show_text:"<gray>Aplica este tag al item de tu mano</gray>"><gradient:#F7B733:#FC4A1A>[Aplicar]</gradient></hover>'
  kind:
    item: 'tag de items'
    block: 'tag de bloques'
  entry: '  <color:#F7B733>•</color> <white><item></white>'
  unknown: '<prefix><red>No existe ningún tag de items o bloques llamado <white>#<tag></white>. Prueba /framesort tag list.</red>'
  list:
    title: 'Tags'
    title-search: 'Tags que contienen "<text>"'
    entry: '  <color:#F7B733>•</color> <white>#<tag></white>'
    hover: '<gray>Clic para ver qué contiene este tag</gray>'

give:
  done: '<prefix><green>Entregado <white><amount>× <item></white> a <white><player></white>.</green>'
  players-only: '<prefix><red>Indica un jugador: /framesort give ... [jugador]</red>'
  unknown-pad: 'No existe ningún tipo de pad llamado ''<type>'''

pad:
  created: '<prefix><green>Teleport pad <white><type></white> creado.</green>'
  not-allowed: '<prefix><red>No puedes crear teleport pads aquí.</red>'
