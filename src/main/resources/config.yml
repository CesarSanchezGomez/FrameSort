# FrameSort: general settings. See docs/configuration.md.

config-version: 1

# File in lang/ that player messages come from: en_US, es_ES or a copy of your own.
language: 'en_US'

sorter:
  activator:
    material: ENDER_EYE
    require-marked: false   # true: only the activator from /framesort give sorter
    name: '<gradient:#F7B733:#FC4A1A>Sorter Activator</gradient>'
    lore:
      - ''
      - ' <gray>Place it in an item frame</gray> '
      - ' <gray>on a dispenser.</gray> '
      - ''
    glint: true
    item-model: ''
  frame-types: [ITEM_FRAME, GLOW_ITEM_FRAME]
  custom-name: '<gradient:#F7B733:#FC4A1A>Item Sorter</gradient>'   # '' = none
  tick-rate: 20   # ticks
  disable-when-powered: false
  hide-frame: true
  show-activity: true

targets:
  registration: manual   # manual | automatic
  positions: [TOP, BOTTOM, FRONT, BACK, LEFT, RIGHT]   # left/right as seen from the front; SIDES = LEFT + RIGHT
  frame-types: [ITEM_FRAME, GLOW_ITEM_FRAME]

delivery:
  max-distance: 64   # blocks
  insert-into-containers: true
  default-target-item: CARROT_ON_A_STICK   # '' = off

inspect:
  highlight-seconds: 5
  colors:
    container: '#55FF55'
    dropped: '#FFFF55'
    lava: '#FF5555'
  page-size: 8
  trace-radius: 32   # blocks
  trace-default-seconds: 60
  trace-max-seconds: 600
