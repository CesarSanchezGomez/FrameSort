# FrameSort: general settings. /framesort reload applies this file.
# Details: https://github.com/CesarSanchezGomez/FrameSort/blob/main/docs/configuration.md#configyml
# Look keys (name, lore, glint) are optional: leave one out and the item has none of it.

config-version: 1

# File in lang/ that player messages come from: en_US, es_ES or a copy of your own.
language: 'en_US'

# Sorters: a dispenser with the activator in an item frame on it.
sorter:
  activator:
    # Item that makes a sorter: a material or 'craftengine:<namespace>:<id>'.
    material: ENDER_EYE
    # true: only the activator from /framesort give sorter works.
    require-marked: false
    # Look of the activator FrameSort hands out.
    # 'components' also works on a vanilla activator (a model, a head texture...).
    name: '<gradient:#F7B733:#FC4A1A>Sorter Activator</gradient>'
    lore:
      - ''
      - ' <gray>Place it in an item frame</gray> '
      - ' <gray>on a dispenser.</gray> '
      - ''
    glint: true
  # Frames that can hold the activator.
  frame-types: [ITEM_FRAME, GLOW_ITEM_FRAME]
  # Optional title of a sorter's inventory; '' = the dispenser's own name.
  custom-name: '<gradient:#F7B733:#FC4A1A>Item Sorter</gradient>'
  # Ticks between two turns of the same sorter.
  tick-rate: 20
  disable-when-powered: false
  # true: hides the frame that holds the activator.
  hide-frame: true
  # true: rotates the activator after each turn that sends something.
  show-activity: true

# Target frames: where sorters and pads send items.
targets:
  # manual: only frames marked with sneak + right-click (empty hand).
  # automatic: every frame on a container or composter.
  registration: manual
  frame-types: [ITEM_FRAME, GLOW_ITEM_FRAME]
  # Look of an item tagged with /framesort tag apply; <tag> is the tag.
  tagged-item:
    name: '<gradient:#F7B733:#FC4A1A>#<tag></gradient>'
    glint: true

# How items reach the targets.
delivery:
  # Blocks around a sorter or pad where targets are searched.
  max-distance: 64
  # false: frames on containers or composters drop the items instead.
  insert-into-containers: true
  # Frames holding it take what no other frame takes; '' = off.
  default-target-item: CARROT_ON_A_STICK

# Who sorters and pads belong to: whoever placed them, and their frames to whoever hung them.
ownership:
  # true: a sorter or pad sends only to its owner's frames and to those of players the owner trusts
  # (/framesort trust), and only they inspect it. false: any frame, and anyone inspects.
  enabled: true

# Inspection, chat lists and /framesort trace.
inspect:
  # Seconds the targets glow for the player who inspected them.
  highlight-seconds: 5
  # Glow and trace colours (#RRGGBB) of targets that store, drop or destroy items.
  colors:
    container: '#55FF55'
    dropped: '#FFFF55'
    lava: '#FF5555'
  # Entries per page in chat lists (tags, inspection).
  page-size: 8
  # Blocks around you that /framesort trace covers.
  trace-radius: 32
  # Default and longest /framesort trace, in seconds.
  trace-default-seconds: 60
  trace-max-seconds: 600
