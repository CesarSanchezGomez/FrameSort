# FrameSort: general settings. /framesort reload applies this file.
# Details: https://github.com/CesarSanchezGomez/FrameSort/blob/main/docs/configuration.md#configyml
# Look keys (name, lore, glint) are optional: leave one out and the item has none of it.

config-version: 1

# File in lang/ that player messages come from: en_US, es_ES or a copy of your own.
language: 'en_US'

# Sorters: a container crafted with the activator, or from /framesort give sorter, sends what goes in it.
sorter:
  # Containers that can be sorters: materials or '#minecraft:<block tag>'. A double chest doesn't sort.
  blocks: [DISPENSER, DROPPER, BARREL, CHEST, TRAPPED_CHEST, '#minecraft:copper_chests', '#minecraft:shulker_boxes']
  # Look of a sorter as an item; <block> is the container's name.
  item:
    name: '<gradient:#F7B733:#FC4A1A><block> Sorter</gradient>'
    lore:
      - ''
      - ' <gray>Items put in it go</gray> '
      - ' <gray>to their target frames.</gray> '
      - ''
    glint: true
  # Crafting a sorter: rows of the grid, with C for the container and A for the activator. Other letters go in
  # 'ingredients' (a material or 'craftengine:<namespace>:<id>'). [] = no recipe, only /framesort give sorter.
  recipe:
    shape: ['A', 'C']
  activator:
    # Item that makes a container a sorter: a material or 'craftengine:<namespace>:<id>'.
    material: HOPPER
    # true: only the activator from /framesort give activator works.
    require-marked: false
    # Look of the activator FrameSort hands out.
    # 'components' also works on a vanilla activator (a model, a head texture...).
    name: '<gradient:#F7B733:#FC4A1A>Sorter Activator</gradient>'
    lore:
      - ''
      - ' <gray>Craft it with a container</gray> '
      - ' <gray>to make a sorter.</gray> '
      - ''
    glint: true
  # Optional title of a sorter's inventory; '' = the container's own name.
  custom-name: '<gradient:#F7B733:#FC4A1A>Sorter</gradient>'
  # Blocks around a sorter where its targets are searched.
  range: 64
  # Ticks between two turns of the same sorter.
  tick-rate: 20
  disable-when-powered: false
  # true: a few specks over a sorter after each turn that sends something.
  show-activity: true

# Target frames: where sorters and pads send items.
targets:
  frame-types: [ITEM_FRAME, GLOW_ITEM_FRAME]
  # Look of an item tagged with /framesort tag apply; <tag> is the tag.
  tagged-item:
    name: '<gradient:#F7B733:#FC4A1A>#<tag></gradient>'
    glint: true

# How items reach the targets.
delivery:
  # false: frames on containers or composters drop the items instead.
  insert-into-containers: true
  # Frames holding it take what no other frame takes; '' = off.
  default-target-item: RECOVERY_COMPASS

# Who sorters, pads and targets belong to: whoever set them up.
ownership:
  # true: a sorter or pad sends only to its owner's frames and to those of players the owner trusts
  # (/framesort trust), and only they inspect it. false: any frame, anyone inspects, no trust commands.
  enabled: true

# Inspection, chat lists and /framesort trace.
inspect:
  # Seconds the targets glow for the player who inspected them.
  highlight-seconds: 5
  # Glow and trace colours (#RRGGBB) of targets that store, drop or destroy items.
  colors:
    container: '#55FF55'
    dropped: '#FFFF55'
    lava: '#FF5555'
  # Entries per page in chat lists (tags, inspection).
  page-size: 8
  # Blocks around you that /framesort trace covers.
  trace-radius: 32
  # Default and longest /framesort trace, in seconds.
  trace-default-seconds: 60
  trace-max-seconds: 600
