group=com.cesarcosmico
version=0.1.0-SNAPSHOT

java_version=25
# Exact build: a dynamic version (26.2.build.+) can resolve to a pre-release.
paper_api_version=26.2.build.129-stable
minecraft_version=26.2
junit_version=6.1.3

# Optional WorldGuard integration.
worldguard_version=7.0.19
# Optional CraftEngine integration.
craftengine_version=26.9.1

# Database. HikariCP must match the version in FrameSortLoader.
hikaricp_version=7.1.0
# The drivers the server ships (SQLite, MySQL) or FrameSortLoader downloads (MariaDB).
sqlite_jdbc_version=3.49.1.0
mysql_connector_version=9.2.0
mariadb_client_version=3.5.10
testcontainers_version=2.0.5

org.gradle.caching=true
org.gradle.parallel=true
