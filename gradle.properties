group=com.cesarcosmico
version=0.1.0-SNAPSHOT

# Constants that are not libraries; library versions are in gradle/libs.versions.toml.
java_version=25
# The test servers: the newest supported Paper line and the minimum one.
minecraft_version=26.3
minecraft_version_minimum=26.2

org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
# Gradle and its daemon read and write files as UTF-8, whatever the machine's default is.
org.gradle.jvmargs=-Dfile.encoding=UTF-8
